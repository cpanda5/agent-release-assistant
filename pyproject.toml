[project]
name = "agent-release-assistant"
version = "0.1.0"
description = "AI SDLC Agent — 研发交付智能助手"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "fastapi>=0.136.3",
    "pydantic-settings>=2.0.0",
    "uvicorn>=0.48.0",
    "aiomysql>=0.2.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
]

[project.scripts]
serve = "main:main"
